name: Desplegar Web Pública en GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:
  repository_dispatch:
    types: [publicar_contenido]

# Permisos requeridos para desplegar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite un despliegue concurrente a la vez para evitar colisiones
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar sitio estático
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://oadmqwtnxpbotxcgzaoo.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hZG1xd3RueHBib3R4Y2d6YW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjExMTI1NDEsImV4cCI6MjA3NjY4ODU0MX0.4y8Hj7YmEwhs9aK_ZgqVzFj3t7xXb8gR2y7B3y6P7rQ' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || '' }}
          NEXT_PUBLIC_INDEXAR: ${{ vars.NEXT_PUBLIC_INDEXAR || '0' }}
        run: npm run build

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
