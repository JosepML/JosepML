    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Josep Mira Lozano | Filmmaker & DOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
      html {
        scroll-behavior: smooth;
      }
      :root {
        --background: 240 5% 96%; /* hsl(240, 5%, 96%) -> #f4f4f5 */
        --surface: 0 0% 100%; /* hsl(0, 0%, 100%) -> #ffffff */
        --text-primary: 240 10% 4%; /* hsl(240, 10%, 4%) -> #09090b */
        --text-secondary: 240 5% 46%; /* hsl(240, 5%, 46%) -> #71717a */
        --border: 240 6% 90%; /* hsl(240, 6%, 90%) -> #e4e4e7 */
      }
      .dark {
        --background: 240 10% 4%; /* hsl(240, 10%, 4%) -> #09090b */
        --surface: 240 4% 12%; /* hsl(240, 4%, 12%) -> #1e1e20 */
        --text-primary: 240 5% 96%; /* hsl(240, 5%, 96%) -> #f4f4f5 */
        --text-secondary: 240 5% 63%; /* hsl(240, 5%, 63%) -> #a1a1aa */
        --border: 240 4% 16%; /* hsl(240, 4%, 16%) -> #27272a */
      }
      body {
        background-color: hsl(var(--background));
        color: hsl(var(--text-primary));
      }
      body.modal-open {
        overflow: hidden;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'brand-accent': '#E50914',
              background: 'hsl(var(--background))',
              surface: 'hsl(var(--surface))',
              'text-primary': 'hsl(var(--text-primary))',
              'text-secondary': 'hsl(var(--text-secondary))',
              border: 'hsl(var(--border))',
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
          }
        }
      }
    </script>
